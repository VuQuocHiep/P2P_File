spring.application.name=PeerMesh Tracker
virustotal.api-key=${VIRUSTOTAL_API_KEY:}
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=33MB
spring.servlet.multipart.file-size-threshold=0
server.port=${TRACKER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:peermesh}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=always
peermesh.admin.username=${ADMIN_USERNAME:vuquochiep2005@gmail.com}
peermesh.admin.password=${ADMIN_PASSWORD:vuquochiep2005}
