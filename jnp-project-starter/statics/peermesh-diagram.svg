<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc PeerMesh</title><desc id="desc">Tracker duyệt tài khoản, peer và file. Ba peer giao tiếp metadata qua HTTP và truyền chunk trực tiếp qua TCP.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59e0ba"/></marker></defs><rect width="1100" height="480" rx="20" fill="#0b1020"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="550" y="41" fill="#edf3ff" font-size="23" font-weight="700">PeerMesh · Tracker điều phối, các peer truyền file trực tiếp</text><rect x="370" y="70" width="360" height="112" rx="14" fill="#182b41" stroke="#3b6080"/><text x="550" y="102" fill="#edf3ff" font-size="19">SERVER / TRACKER · Spring Boot</text><text x="550" y="130" fill="#a8c0d8" font-size="14">Duyệt tài khoản · Peer · Danh mục file</text><text x="550" y="155" fill="#a8c0d8" font-size="14">H2 · HTTP · WebSocket · Heartbeat</text><g stroke="#7da8ff" stroke-width="2" stroke-dasharray="6 5"><path d="M410 182L205 285"/><path d="M550 182V285"/><path d="M690 182L895 285"/></g><rect x="362" y="207" width="376" height="27" rx="7" fill="#0b1020"/><text x="550" y="226" fill="#7da8ff" font-size="13">HTTP / JSON: đăng nhập, tìm nguồn, cấp quyền</text><g fill="#15332e" stroke="#367568"><rect x="70" y="285" width="270" height="110" rx="14"/><rect x="415" y="285" width="270" height="110" rx="14"/><rect x="760" y="285" width="270" height="110" rx="14"/></g><g fill="#edf3ff" font-size="19"><text x="205" y="318">PEER A</text><text x="550" y="318">PEER B</text><text x="895" y="318">PEER C</text></g><g fill="#a7c8bf" font-size="14"><text x="205" y="346">WebSocket + Java TCP</text><text x="550" y="346">WebSocket + Java TCP</text><text x="895" y="346">WebSocket + Java TCP</text><text x="205" y="373">Gửi &amp; nhận chunk</text><text x="550" y="373">Gửi &amp; nhận chunk</text><text x="895" y="373">Gửi &amp; nhận chunk</text></g><g stroke="#59e0ba" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" fill="none"><path d="M350 340H405"/><path d="M695 340H750"/><path d="M205 406V436H895V406"/></g><rect x="290" y="420" width="520" height="28" rx="7" fill="#0b1020"/><text x="550" y="440" fill="#59e0ba" font-size="14">TCP PM01 · Chunk 256 KiB · Nhiều nguồn · SHA-256 · Resume</text></g></svg>
