spring.application.name=PeerMesh Peer
server.address=${PEER_WEB_BIND:127.0.0.1}
server.port=${PEER_WEB_PORT:8081}
server.servlet.session.cookie.name=PEERMESH_${server.port}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2100MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=always
peer.tracker=${TRACKER_URL:http://127.0.0.1:8080}
peer.tcp-port=${PEER_TCP_PORT:9001}
peer.data=${PEER_DATA:./data/peer-8081}
peer.upload-delay-ms=${PEER_UPLOAD_DELAY_MS:0}
