spring.application.name=PeerMesh Tracker
virustotal.api-key=${VIRUSTOTAL_API_KEY:}
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=33MB
spring.servlet.multipart.file-size-threshold=0
server.port=${TRACKER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.datasource.url=jdbc:h2:file:${TRACKER_DATA:./data/tracker}/database
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=always
peermesh.admin.username=${ADMIN_USERNAME:vuquochiep2005@gmail.com}
peermesh.admin.password=${ADMIN_PASSWORD:vuquochiep2005}
